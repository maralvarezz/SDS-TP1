simulation.n=100
simulation.l=20.0
simulation.m=10
simulation.rc=1.0

simulation.radius.min=0.23
simulation.radius.max=0.26

simulation.periodic=false
simulation.random-seed=
simulation.input-mode=auto

simulation.input.static=input/static.txt
simulation.input.dynamic=input/dynamic.txt

simulation.output.neighbours=output/neighbours.txt
simulation.output.time=output/time.txt

# Particula "pasada como input" que se destaca en la figura (punto 1 del enunciado)
simulation.target-particle=1

# Generacion automatica de la figura estatica en cada corrida (punto 1 y 6)
simulation.viz.enabled=false
simulation.viz.python-executable=python3
simulation.viz.plot-script=viz/plot_static.py
simulation.viz.output-dir=output/figures
simulation.viz.render-data=output/render_data.json
